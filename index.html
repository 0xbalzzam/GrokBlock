<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GrokBlock</title>
<style>
:root { --panel:rgba(0,0,0,.62); --fg:#fff }
html,body { margin:0; height:100%; overflow:hidden; background:#87ceeb; font-family:"Courier New",monospace; color:var(--fg); touch-action:none }
canvas { display:block; touch-action:none }
#hud { position:fixed; left:8px; top:calc(8px + env(safe-area-inset-top)); background:var(--panel); padding:6px 8px; font-size:13px; line-height:1.4; border:2px solid #000; max-width:46vw }
#hud b { font-size:16px }
.f { color:#e22 } .hf { background:linear-gradient(90deg,#e22 50%,#522 50%); -webkit-background-clip:text; background-clip:text; color:transparent } .e { opacity:.3 }
#coins { position:fixed; right:8px; top:calc(8px + env(safe-area-inset-top)); background:var(--panel); border:2px solid #e6c200; padding:6px 10px; font-size:18px; font-weight:700; text-align:right }
#coins small { display:block; font-size:10px; font-weight:400 }
#vil { position:fixed; left:50%; transform:translateX(-50%); top:calc(8px + env(safe-area-inset-top)); background:var(--panel); padding:4px 8px; border:2px solid #000; font-size:12px; text-align:center; min-width:180px }
#vb { height:6px; background:#400; margin-top:3px } #vf { height:100%; background:#3c3; width:100% }
#cross { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); font-size:26px; text-shadow:0 0 3px #000; pointer-events:none }
#pr { position:fixed; left:50%; top:calc(50% + 22px); width:60px; height:6px; margin-left:-30px; background:rgba(0,0,0,.5); display:none } #pf { height:100%; background:#fff; width:0 }
#bar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom)); display:flex; gap:3px; z-index:4 }
.sl { width:46px; height:46px; background:var(--panel); border:3px solid #444; position:relative; display:flex; align-items:center; justify-content:center }
.sl.sel { border-color:#fff } .sl i { width:22px; height:22px; display:block }
.sl span { position:absolute; right:2px; bottom:0; font-size:12px; text-shadow:1px 1px #000 }
.sl u { position:absolute; left:2px; top:0; font-size:10px; text-decoration:none; opacity:.75 }
#selname,#hint { position:fixed; left:0; right:0; text-align:center; font-size:12px; text-shadow:0 2px 3px #000; pointer-events:none }
#selname { bottom:calc(128px + env(safe-area-inset-bottom)) }
#hint { bottom:calc(8px + env(safe-area-inset-bottom)) }
#msg { position:fixed; left:0; right:0; top:18%; text-align:center; font-size:20px; font-weight:700; text-shadow:0 2px 5px #000; pointer-events:none; padding:0 16px }
#flash { position:fixed; inset:0; background:#f00; opacity:0; pointer-events:none }
#inv { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(400px,92vw); background:rgba(0,0,0,.82); border:3px solid #fff; padding:14px; display:none; z-index:5 }
#start,#over { position:fixed; inset:0; background:rgba(0,0,0,.84); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; z-index:6 }
#over { display:none; z-index:9 }
h1 { font-size:34px; margin:0 0 6px }
#credit,#credit2 { color:#ffd740; font-size:16px; margin:0 0 8px }
p { max-width:680px; line-height:1.4; margin:5px; font-size:14px }
input,button { font:15px monospace; margin:4px; padding:8px 10px }
button { cursor:pointer; background:#111; color:#fff; border:2px solid #fff }
#share { position:fixed; right:8px; top:calc(58px + env(safe-area-inset-top)); z-index:8; padding:6px 8px }
#room { font-size:18px; color:#ffd740; min-height:24px }
#stick { position:fixed; left:18px; bottom:calc(24px + env(safe-area-inset-bottom)); width:120px; height:120px; border-radius:50%; background:rgba(0,0,0,.35); border:2px solid #fff; z-index:7; display:none }
#knob { position:absolute; left:40px; top:40px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.8) }
#acts { position:fixed; right:14px; bottom:calc(24px + env(safe-area-inset-bottom)); display:none; gap:8px; z-index:7 }
#acts button { width:68px; height:68px; border-radius:50%; font-size:13px }
</style>
</head>
<body>
<div id="hud"></div><div id="coins">0<small>COINS</small></div><div id="vil"></div>
<div id="cross">+</div><div id="pr"><div id="pf"></div></div><div id="selname"></div>
<div id="bar"></div><div id="hint"></div><div id="msg"></div><div id="flash"></div><div id="inv"></div>
<button id="share" type="button">Share on X</button>
<div id="stick"><div id="knob"></div></div>
<div id="acts"><button id="bjump" type="button">Jump</button><button id="bhit" type="button">Hit</button><button id="bplace" type="button">Place</button></div>
<div id="start">
<h1>GROKBLOCK</h1>
<div id="credit">Created by @0xbalzzam</div>
<p>15 zombies every night. Every 5th night the boss is Elon. On a phone use the stick, drag the right side to look, and the Jump / Hit / Place buttons.</p>
<input id="pname" value="Player" placeholder="Your name">
<div>
<button id="solo" type="button">Play solo</button>
<button id="host" type="button">Host room</button>
<input id="code" placeholder="Room code" style="width:140px">
<button id="join" type="button">Join</button>
</div>
<div id="room"></div>
</div>
<div id="over">
<h1>YOU FELL</h1>
<div id="credit2">Created by @0xbalzzam</div>
<p id="overtext"></p>
<button id="restart" type="button">Restart</button>
<button id="share2" type="button">Share on X</button>
</div>

    zs.forEach(z=>{ const m=z.mesh, pd=Math.hypot(P.x-m.position.x,P.z-m.position.z); let tx=P.x,tz=P.z; if(pd>(z.boss?10:16)){ let bd=1e9; alive.forEach(o=>{ const d=Math.hypot(o.x-m.position.x,o.z-m.position.z); if(d<bd){ bd=d; tx=o.x; tz=o.z } }) } const dx=tx-m.position.x,dz=tz-m.position.z,d=Math.hypot(dx,dz)||1; m.rotation.y=Math.atan2(dx,dz); z.cd-=dt; if(pd<(z.boss?1.9:1.3)){ if(z.cd<=0){ z.cd=z.boss?.85:1; S.hp-=Math.max(1,(z.boss?8+S.night*1.8:3+S.night*1.5)-S.armor*1.3); flash=.5; sfx.hurt() } } else if(d>.8){ const v=((z.boss?1.55:2)+S.night*.2)*dt,ax=m.position.x+dx/d*v,az=m.position.z+dz/d*v; const bx_=sol(ax,.5,m.position.z)?[ax|0,0,m.position.z|0]:sol(ax,1.5,m.position.z)?[ax|0,1,m.position.z|0]:null; const bz_=sol(m.position.x,.5,az)?[m.position.x|0,0,az|0]:sol(m.position.x,1.5,az)?[m.position.x|0,1,az|0]:null; if(!bx_) m.position.x=ax; if(!bz_) m.position.z=az; const bl_=Math.abs(dx)>Math.abs(dz)?bx_:bz_; if(bl_){ z.bt+=dt; if(z.bt>=(z.boss?.5:1.15)){ z.bt=0; const key=bl_.join(','); rmB(key); broadcast({t:'block',op:'rm',k:key}) } } else z.bt=0 } if(z.tag) z.tag.position.set(m.position.x,3.5,m.position.z) });
    if(S.kills>=15){ const first=!S.potions; S.cleared++; S.night++; S.phase='day'; S.t=Math.max(40,75-S.night); S.hp=maxHp(); S.coins+=20+S.night*2; INV.planks+=6; INV.cobble+=4; if(first) S.potions=true; clearZ(); sfx.dawn(); toast('Cleared '+S.cleared+(isBoss(S.night)?' · next is Elon':''),4) }
   }
  }
  chkT-=dt; if(chkT<=0){ chkT=.5; H.forEach(o=>{ const a=houseAlive(o)>=.45; if(o.alive&&!a) toast('A house fell',2); o.alive=a }); if(H.every(o=>!o.alive)) gameOver('The village fell.') }
  if(S.hp<=0) gameOver('You died.');
  if(net.mode!='solo'){ net.sendT-=dt; if(net.sendT<=0){ net.sendT=.12; broadcast({t:'state',id:net.id,name:net.name,x:P.x,y:P.y,z:P.z,yaw}) } net.players.forEach(pl=>{ pl.mesh.position.set(pl.x,pl.y,pl.z); pl.mesh.rotation.y=pl.yaw; pl.tag.position.set(pl.x,pl.y+2.4,pl.z) }) }
 }
 const tg=S.phase=='night'?1:0; sky+=(tg-sky)*dt*.8; col.copy(sd).lerp(sn,sky); sc.background=col; sc.fog.color.copy(col); sun.intensity=.85-sky*.7; amb.intensity=.6-sky*.4;
 cam.position.set(P.x,P.y+1.62,P.z); cam.rotation.y=yaw; cam.rotation.x=pit;
 const pa=(S.phase=='day'?1-S.t/70:S.kills/15)*Math.PI; sunM.visible=S.phase!='night'; moonM.visible=S.phase=='night'; const ob=S.phase=='night'?moonM:sunM; ob.position.set(P.x+Math.cos(pa)*85,Math.sin(pa)*70+5,P.z-20); ob.quaternion.copy(cam.quaternion);
 clouds.forEach(c=>{ c.position.x+=dt; if(c.position.x>90) c.position.x=-90 });
 flash=Math.max(0,flash-dt); $('flash').style.opacity=flash*.6;
 const rr=started&&S.phase!='over'?ray():null; if(rr&&rr.c&&!rr.g){ sel_.visible=true; sel_.position.set(rr.c[0]+.5,rr.c[1]+.5,rr.c[2]+.5) } else sel_.visible=false;
 const pk=SLOT[sel]; if(rr&&rr.p&&MT[pk]&&INV[pk]>0){ ghost.visible=true; ghost.position.set(rr.p[0]+.5,rr.p[1]+.5,rr.p[2]+.5) } else ghost.visible=false;
 $('pr').style.display=bp>0?'block':'none'; $('pf').style.width=Math.min(100,bp*100)+'%';
 hudT-=dt; if(hudT<=0){ hudT=.12; hudUpdate() } toastT-=dt; if(toastT<=0) $('msg').textContent='';
 R.render(sc,cam);
}
loop();
